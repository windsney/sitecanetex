{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-6 px-4">
    <!-- Formulário com suporte a arquivos (enctype multipart) -->
    <form method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md space-y-6">
        {% csrf_token %}
        
        <!-- Cabeçalho padrão do sistema -->
        <div class="border-b pb-4 mb-4 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Registro de Atividade e Comprovação</h2>
                <p class="text-xs text-gray-500 mt-1">Escala do dia: <span class="font-semibold text-blue-900">{{ escala.data|date:"d/m/Y" }}</span></p>
            </div>
            <a href="{% url 'efetivo:painel_escala' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded text-xs transition-colors">
                ⬅ Voltar
            </a>
        </div>

        <!-- Bloco de Informações / Relatório -->
        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 space-y-4 shadow-sm">
            <div class="border-b pb-2">
                <h3 class="font-bold text-blue-900 text-sm">Informações do Turno e Local</h3>
            </div>

            <!-- Observação / Relatório da Atividade -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Relatório / Observações do Policial:</label>
                <textarea name="observacao" rows="4" class="w-full border border-gray-300 rounded p-2 text-xs focus:ring-1 focus:ring-blue-500 outline-none bg-white" placeholder="Descreva o patrulhamento, ocorrências ou o andamento do ponto fixo..."></textarea>
            </div>

            <!-- Bloco de Upload de Foto -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Anexar Foto de Comprovação (Local / Missão):</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-gray-50 transition-colors">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
                            <svg class="w-8 h-8 mb-2 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                            </svg>
                            <p class="text-xs text-gray-500"><span class="font-semibold">Clique para enviar</span> ou arraste a foto aqui</p>
                            <p class="text-[10px] text-gray-400 mt-1">PNG, JPG ou WEBP</p>
                        </div>
                        <input type="file" name="foto_comprovacao" accept="image/*" class="hidden" />
                    </label>
                </div>
            </div>
        </div>

        <!-- Botão de Envio idêntico ao padrão do Cartão-Programa -->
        <div class="flex justify-end pt-4 border-t">
            <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 px-6 rounded shadow transition-colors text-xs flex items-center gap-2">
                💾 Enviar Comprovação
            </button>
        </div>
    </form>
</div>
{% endblock %}
